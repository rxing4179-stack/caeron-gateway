<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QQ (NapCat) 实时扫码登录</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 65%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px 24px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .success-banner {
      display: none;
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid rgba(34, 197, 94, 0.45);
      color: #86efac;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 12px;
      max-width: 100%;
    }
    .badge.ok {
      background: rgba(34, 197, 94, 0.12);
      color: var(--ok);
      border-color: rgba(34, 197, 94, 0.3);
    }
    .badge.warn {
      background: rgba(245, 158, 11, 0.12);
      color: var(--warn);
      border-color: rgba(245, 158, 11, 0.3);
    }
    .badge.err {
      background: rgba(239, 68, 68, 0.12);
      color: var(--err);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }
    .server-msg {
      font-size: 13px;
      color: #e2e8f0;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 10px;
      padding: 9px 12px;
      margin-bottom: 16px;
      line-height: 1.45;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-box {
      width: 260px;
      height: 260px;
      margin: 0 auto 18px;
      background: #ffffff;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.08);
    }
    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      display: block;
      transition: opacity 0.2s ease;
    }
    .placeholder {
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }
    .done-icon {
      display: none;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.15);
      border: 3px solid var(--ok);
      color: var(--ok);
      font-size: 50px;
      line-height: 90px;
      font-weight: 700;
    }
    .stats {
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      text-align: left;
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .label { color: var(--muted); }
    .val { font-variant-numeric: tabular-nums; font-weight: 500; }
    .actions {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #082f49;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .tip {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>小沈 QQ 实时扫码登录</h1>
    <p class="subtitle">目标账号：3621487982<br />每 2 秒同步服务端登录状态与真实码龄，异常中断会自动重启换码</p>

    <div id="successBanner" class="success-banner">
      🎉 扫码登录成功！小沈 QQ 已上线并重连网关！
    </div>

    <div id="statusBadge" class="badge">
      <span class="dot"></span>
      <span id="statusText">正在同步服务端状态...</span>
    </div>

    <div id="serverMsgBox" class="server-msg">正在连接服务端监控...</div>

    <div class="qr-box">
      <img id="qrImg" alt="NapCat 登录二维码" style="display:none;" />
      <span id="placeholder" class="placeholder">加载中...</span>
      <div id="doneIcon" class="done-icon">✓</div>
    </div>

    <div class="stats">
      <div class="row">
        <span class="label">最近检查时间</span>
        <span id="lastCheckTime" class="val">--:--:--</span>
      </div>
      <div class="row">
        <span class="label">服务端码生成时间</span>
        <span id="lastUpdateTime" class="val">--:--:--</span>
      </div>
      <div class="row">
        <span class="label">服务端真实码龄</span>
        <span id="ageText" class="val">-- 秒</span>
      </div>
      <div class="row">
        <span class="label">自动换码次数</span>
        <span id="changeCount" class="val">0 次</span>
      </div>
    </div>

    <div class="actions">
      <button id="refreshBtn" type="button">立即刷新检查</button>
    </div>

    <p class="tip">请用手机 QQ（登录 3621487982 的那一端）扫描上方二维码并确认授权。</p>
  </main>

  <script>
    const BASE_URL = (location.protocol === 'http:' || location.protocol === 'https:')
      ? ''
      : 'http://1.14.59.116:8080';
    let ADMIN_TOKEN = localStorage.getItem('caeron_admin_token') || '';
    if (!ADMIN_TOKEN) {
      ADMIN_TOKEN = prompt('Caeron Admin Token:') || '';
      if (ADMIN_TOKEN) localStorage.setItem('caeron_admin_token', ADMIN_TOKEN);
    }
    const QR_ENDPOINT = BASE_URL + '/napcat/qr';
    function buildQrUrl() {
      const base = QR_ENDPOINT + (QR_ENDPOINT.includes('?') ? '&' : '?') + 't=' + Date.now();
      return ADMIN_TOKEN ? `${base}&token=${encodeURIComponent(ADMIN_TOKEN)}` : base;
    }
    const STATUS_ENDPOINT = BASE_URL + '/static/qr_status.json';
    const POLL_INTERVAL_MS = 2000;

    const successBanner = document.getElementById('successBanner');
    const qrImg = document.getElementById('qrImg');
    const placeholder = document.getElementById('placeholder');
    const doneIcon = document.getElementById('doneIcon');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const serverMsgBox = document.getElementById('serverMsgBox');
    const lastCheckTimeEl = document.getElementById('lastCheckTime');
    const lastUpdateTimeEl = document.getElementById('lastUpdateTime');
    const ageTextEl = document.getElementById('ageText');
    const changeCountEl = document.getElementById('changeCount');
    const refreshBtn = document.getElementById('refreshBtn');

    let lastBase64 = '';
    let changeCount = 0;
    let inFlight = false;
    let fallbackMode = false;
    let pollTimer = null;
    let ageTimer = null;

    let isLoggedIn = false;
    let isRestarting = false;
    let serverQrMtime = 0;
    let qrAgeBaseSec = null;
    let qrAgeFetchedAt = 0;
    let lastShownMtime = 0;

    function fmtTime(d = new Date()) {
      return d.toLocaleTimeString('zh-CN', { hour12: false });
    }

    function setBadge(kind, text) {
      statusBadge.className = 'badge' + (kind ? ' ' + kind : '');
      statusText.textContent = text;
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function handleLoggedIn(msg) {
      isLoggedIn = true;
      isRestarting = false;
      successBanner.style.display = 'block';
      serverMsgBox.textContent = msg || '🎉 扫码登录成功！小沈 QQ 已上线并重连网关！';
      setBadge('ok', '登录成功 · 网关已在线');
      qrImg.style.display = 'none';
      placeholder.style.display = 'none';
      doneIcon.style.display = 'block';
      ageTextEl.textContent = '已在线';
      ageTextEl.style.color = 'var(--ok)';
      refreshBtn.disabled = false;
      if (pollTimer) clearInterval(pollTimer);
      if (ageTimer) clearInterval(ageTimer);
    }

    function refreshViaImageFallback(manual) {
      const url = buildQrUrl();
      const preloader = new Image();
      preloader.onload = () => {
        const isInitial = !qrAgeFetchedAt;
        qrImg.src = url;
        qrImg.style.display = 'block';
        qrImg.style.opacity = '1';
        placeholder.style.display = 'none';
        lastUpdateTimeEl.textContent = fmtTime();
        qrAgeBaseSec = 0;
        qrAgeFetchedAt = Date.now();
        changeCountEl.textContent = '直连模式(4秒自动重载)';
        serverMsgBox.textContent = '本地 file:// 模式已开启直连拉取，建议直接访问服务器在线页面查看服务端实时状态';
        setBadge('warn', manual ? '已手动刷新（本地直连模式）' : '本地文件兼容模式：每 4 秒拉取');
        updateAge();
        inFlight = false;
        refreshBtn.disabled = false;
        if (isInitial) {
          clearInterval(pollTimer);
          pollTimer = setInterval(() => checkQr(false), 4000);
        }
      };
      preloader.onerror = () => {
        setBadge('err', '无法连接服务器或二维码未生成');
        inFlight = false;
        refreshBtn.disabled = false;
      };
      preloader.src = url;
    }

    async function checkQr(manual = false) {
      if (inFlight || isLoggedIn) return;
      inFlight = true;
      if (manual) refreshBtn.disabled = true;
      lastCheckTimeEl.textContent = fmtTime();

      if (fallbackMode) {
        refreshViaImageFallback(manual);
        return;
      }

      try {
        // 1. 先同步服务端 qr_status.json
        let status = null;
        try {
          const stResp = await fetch(STATUS_ENDPOINT + '?t=' + Date.now(), { cache: 'no-store' });
          if (stResp.ok) {
            status = await stResp.json();
          }
        } catch (stErr) {
          if (BASE_URL) {
            throw stErr;
          }
        }

        if (status) {
          if (status.logged_in) {
            handleLoggedIn(status.status_msg);
            return;
          }

          serverMsgBox.textContent = status.status_msg || '等待扫码...';
          serverQrMtime = Number(status.qr_mtime || 0);
          isRestarting = Boolean(status.restarting || !status.qr_ready);

          if (serverQrMtime > 0) {
            lastUpdateTimeEl.textContent = fmtTime(new Date(serverQrMtime * 1000));
          }

          if (isRestarting) {
            qrAgeBaseSec = null;
            ageTextEl.textContent = '刷新中...';
            ageTextEl.style.color = 'var(--warn)';
            qrImg.style.opacity = '0.35';
            setBadge('warn', '正在重新生成新二维码，请稍等...');
            return;
          }

          qrAgeBaseSec = Number(status.qr_age_sec || 0);
          qrAgeFetchedAt = Date.now();
          qrImg.style.opacity = '1';
          updateAge();

          if (qrAgeBaseSec >= 115) {
            setBadge('warn', '二维码即将过期（将自动换新）');
          } else {
            setBadge('ok', manual ? '已刷新检查 · 二维码有效' : '实时监控中 · 请扫码授权');
          }
        } else {
          serverMsgBox.textContent = '未检测到服务端状态文件，直接拉取最新二维码';
        }

        // 2. 当二维码就绪时拉取图片并做字节对比，防止闪烁
        const resp = await fetch(buildQrUrl(), { cache: 'no-store' });
        if (!resp.ok) {
          if (resp.status === 401) {
            localStorage.removeItem('caeron_admin_token');
            ADMIN_TOKEN = '';
            setBadge('err', '认证失败，请刷新重新输入 Token');
            return;
          }
          setBadge('err', '拉取二维码失败 HTTP ' + resp.status);
          return;
        }
        const buf = await resp.arrayBuffer();
        const b64 = arrayBufferToBase64(buf);
        const bytesChanged = b64 !== lastBase64;
        const mtimeChanged = serverQrMtime > 0 && serverQrMtime !== lastShownMtime;

        if (bytesChanged) {
          const isInitial = lastBase64 === '';
          lastBase64 = b64;
          lastShownMtime = serverQrMtime || Date.now();
          qrImg.src = 'data:image/png;base64,' + b64;
          qrImg.style.display = 'block';
          qrImg.style.opacity = '1';
          placeholder.style.display = 'none';
          if (!isInitial) {
            changeCount += 1;
            changeCountEl.textContent = changeCount + ' 次';
            setBadge('ok', '已自动更换为全新二维码！');
          }
          if (!status) {
            lastUpdateTimeEl.textContent = fmtTime();
            qrAgeBaseSec = 0;
            qrAgeFetchedAt = Date.now();
            updateAge();
          }
        } else if (mtimeChanged && status) {
          lastShownMtime = serverQrMtime;
        }
      } catch (err) {
        if (BASE_URL) {
          fallbackMode = true;
          refreshViaImageFallback(manual);
          return;
        }
        setBadge('err', '请求失败：' + (err && err.message ? err.message : '网络异常'));
      } finally {
        if (!fallbackMode) {
          inFlight = false;
          refreshBtn.disabled = false;
        }
      }
    }

    function updateAge() {
      if (isLoggedIn || isRestarting) return;
      if (qrAgeBaseSec === null || !qrAgeFetchedAt) {
        ageTextEl.textContent = '-- 秒';
        return;
      }
      const sec = Math.max(0, qrAgeBaseSec + Math.floor((Date.now() - qrAgeFetchedAt) / 1000));
      if (sec >= 120) {
        ageTextEl.textContent = sec + ' 秒 (即将自动换新)';
        ageTextEl.style.color = 'var(--warn)';
      } else {
        ageTextEl.textContent = sec + ' 秒 (服务端真实码龄)';
        ageTextEl.style.color = 'var(--text)';
      }
    }

    refreshBtn.addEventListener('click', () => checkQr(true));

    checkQr(false);
    pollTimer = setInterval(() => checkQr(false), POLL_INTERVAL_MS);
    ageTimer = setInterval(updateAge, 1000);
  </script>
</body>
</html>
